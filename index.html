<script>
  window.location.href = "https://comfortstudy1.vercel.app";
</script>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ComfortStudy - Login</title>
    <!-- Ícones Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <!-- Script Oficial do Google -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --primary-blue: #3b82f6;
            --primary-hover: #2563eb;
            --text-white: #ffffff;
            --text-muted: #94a3b8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1e3a8a 0%, #0b0f19 50%, #1e1b4b 100%);
            color: var(--text-white);
            padding: 20px;
        }

        .login-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 440px;
        }

        .brand-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: #fff;
            margin: 0 auto 16px auto;
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.3);
        }

        .brand-header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 6px;
        }

        .brand-header p {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.4;
        }

        .login-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 32px 28px;
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .card-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .card-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .input-group { margin-bottom: 16px; }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 16px;
            color: var(--text-muted);
            font-size: 18px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 16px 14px 46px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.2s;
        }

        .input-wrapper input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .forgot-pass {
            display: block;
            text-align: right;
            font-size: 12px;
            color: var(--primary-blue);
            text-decoration: none;
            margin-top: 8px;
            margin-bottom: 20px;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #2563eb, #3b82f6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-primary:hover { opacity: 0.95; }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: var(--text-muted);
            font-size: 12px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--input-border);
        }

        .divider span { padding: 0 10px; }

        /* Container centralizado para o botão oficial do Google */
        .google-btn-container {
            display: flex;
            justify-content: center;
            width: 100%;
            min-height: 44px;
        }

        .signup-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 24px;
        }

        .signup-text a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .signup-text a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-wrapper">
        <div class="brand-header">
            <div class="brand-icon"><i class="ph ph-graduation-cap"></i></div>
            <h1>ComfortStudy</h1>
            <p>Organize seus estudos,<br>conquiste seus objetivos.</p>
        </div>

        <div class="login-card">
            <h2 class="card-title">Bem-vindo de volta!</h2>
            <p class="card-subtitle">Entre na sua conta para continuar</p>

            <form action="index_2.html">
                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input type="email" placeholder="E-mail" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <i class="ph ph-lock"></i>
                        <input type="password" placeholder="Senha" required>
                    </div>
                </div>

                <a href="#" class="forgot-pass">Esqueceu sua senha?</a>

                <button type="submit" class="btn-primary">Entrar <i class="ph ph-arrow-right"></i></button>
            </form>

            <div class="divider"><span>ou</span></div>

            <!-- CONTAINER ONDE O GOOGLE VAIS RENDERIZAR O BOTÃO -->
            <div class="google-btn-container">
                <div id="googleBtn"></div>
            </div>

            <!-- BOTÃO DE REGISTRO / CADASTRO -->
            <p class="signup-text">Ainda não tem uma conta? <a href="cadastro.html">Cadastre-se</a></p>
        </div>
    </div>

    <script>
        function handleCredentialResponse(response) {
            // Sucesso na autenticação: redireciona para a dashboard
            window.location.href = "index_2.html";
        }

        window.onload = function () {
            if (window.google) {
                google.accounts.id.initialize({
                    client_id: "220214441909-s31fingnai04ghtbomjp26kai7mi2vnm.apps.googleusercontent.com",
                    callback: handleCredentialResponse,
                    auto_select: false
                });

                // Renderiza o botão nativo e interativo do Google
                google.accounts.id.renderButton(
                    document.getElementById("googleBtn"),
                    { 
                        theme: "filled_blue", 
                        size: "large", 
                        width: "100%",
                        text: "continue_with",
                        shape: "rectangular"
                    }
                );
            }
        }
    </script>
</body>
</html>
