<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ComfortStudy - Recuperar senha</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0f19"><link rel="apple-touch-icon" href="icons/icon-192.png"><script src="https://unpkg.com/@phosphor-icons/web"></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#fff;background:radial-gradient(circle at top left,#1e3a8a,#0b0f19 55%,#1e1b4b);font-family:Segoe UI,Tahoma,sans-serif}.card{width:100%;max-width:440px;background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:30px;box-sizing:border-box}.icon{width:56px;height:56px;margin:0 auto 16px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(135deg,#3b82f6,#6366f1);font-size:28px}h1{text-align:center;font-size:25px;margin:0 0 8px}p{color:#94a3b8;text-align:center;font-size:13px;line-height:1.5}input{width:100%;box-sizing:border-box;padding:13px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:rgba(15,23,42,.6);color:#fff;margin:8px 0 12px;outline:none}button{width:100%;padding:13px;border:0;border-radius:10px;background:#3b82f6;color:#fff;font-weight:600;cursor:pointer}a{display:block;text-align:center;margin-top:18px;color:#60a5fa;text-decoration:none;font-size:13px}.msg{display:none;margin:10px 0;padding:10px;border-radius:9px;background:rgba(34,197,94,.12);color:#86efac;font-size:12px;text-align:center}</style></head><body><div class="card"><div class="icon"><i class="ph ph-graduation-cap"></i></div><h1>Recuperar senha</h1><p>Informe o e-mail da conta cadastrada neste dispositivo e escolha uma nova senha.</p><div id="msg" class="msg"></div><form id="form"><input id="email" type="email" required placeholder="E-mail"><input id="password" type="password" minlength="6" required placeholder="Nova senha"><button>Salvar nova senha</button></form><a href="index.html">Voltar para o login</a></div><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();let a;try{a=JSON.parse(localStorage.getItem('comfortAuthUser'))}catch{}const email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,msg=document.getElementById('msg');if(!a||a.email!==email){msg.textContent='Conta não encontrada neste dispositivo.';msg.style.display='block';msg.style.background='rgba(239,68,68,.12)';msg.style.color='#fca5a5';return;}a.password=password;localStorage.setItem('comfortAuthUser',JSON.stringify(a));msg.textContent='Senha alterada com sucesso! Agora você pode entrar.';msg.style.display='block';msg.style.background='rgba(34,197,94,.12)';msg.style.color='#86efac';});</script></body></html>
