<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComfortStudy - Cadastro</title>
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b0f19"><link rel="apple-touch-icon" href="icons/icon-192.png">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root{--bg:#0b0f19;--card:rgba(15,23,42,.78);--border:rgba(255,255,255,.08);--blue:#3b82f6;--muted:#94a3b8}*{box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:#fff;background:radial-gradient(circle at top left,#1e3a8a 0%,#0b0f19 50%,#1e1b4b 100%)}.wrap{width:100%;max-width:440px}.brand{text-align:center;margin-bottom:24px}.icon{width:56px;height:56px;margin:auto auto 12px;border-radius:16px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,#3b82f6,#6366f1)}h1{font-size:27px;margin:0 0 5px}.brand p{color:var(--muted);font-size:14px;margin:0}.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:30px 28px;backdrop-filter:blur(12px);box-shadow:0 20px 40px rgba(0,0,0,.4)}h2{margin:0 0 6px;font-size:20px}.sub{margin:0 0 22px;color:var(--muted);font-size:13px}.group{margin-bottom:14px}.group label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.input{position:relative}.input i{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted)}input{width:100%;padding:13px 14px 13px 43px;background:rgba(15,23,42,.6);border:1px solid rgba(255,255,255,.12);border-radius:10px;color:#fff;outline:none}input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}button{width:100%;padding:14px;border:0;border-radius:10px;background:linear-gradient(90deg,#2563eb,#3b82f6);color:#fff;font-size:15px;font-weight:600;cursor:pointer;margin-top:7px}.msg{display:none;padding:10px;border-radius:9px;margin-bottom:15px;font-size:12px;background:rgba(239,68,68,.12);color:#fca5a5}.back{text-align:center;margin-top:18px;font-size:13px}.back a{color:#60a5fa;text-decoration:none}</style>
</head><body><div class="wrap"><div class="brand"><div class="icon"><i class="ph ph-graduation-cap"></i></div><h1>ComfortStudy</h1><p>Organize seus estudos,<br>conquiste seus objetivos.</p></div><div class="card"><h2>Crie sua conta</h2><p class="sub">Cadastre-se para começar a organizar seus estudos.</p><div id="msg" class="msg"></div><form id="form"><div class="group"><label>Nome</label><div class="input"><i class="ph ph-user"></i><input id="name" required placeholder="Seu nome" autocomplete="name"></div></div><div class="group"><label>E-mail</label><div class="input"><i class="ph ph-envelope-simple"></i><input id="email" type="email" required placeholder="E-mail" autocomplete="email"></div></div><div class="group"><label>Senha</label><div class="input"><i class="ph ph-lock"></i><input id="password" type="password" minlength="6" required placeholder="Mínimo 6 caracteres" autocomplete="new-password"></div></div><div class="group"><label>Confirmar senha</label><div class="input"><i class="ph ph-lock-key"></i><input id="confirm" type="password" minlength="6" required placeholder="Repita sua senha" autocomplete="new-password"></div></div><button type="submit">Criar conta <i class="ph ph-arrow-right"></i></button></form><div class="back">Já tem uma conta? <a href="index.html">Entrar</a></div></div></div><script>document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();const name=document.getElementById('name').value.trim(),email=document.getElementById('email').value.trim().toLowerCase(),password=document.getElementById('password').value,confirm=document.getElementById('confirm').value,msg=document.getElementById('msg');if(password!==confirm){msg.textContent='As senhas não coincidem.';msg.style.display='block';msg.style.background='rgba(239,68,68,.12)';msg.style.color='#fca5a5';return;}let existing=null;try{existing=JSON.parse(localStorage.getItem('comfortAuthUser')||'null')}catch{}if(existing&&existing.email===email){msg.textContent='Este e-mail já está cadastrado. Volte ao login para entrar.';msg.style.display='block';msg.style.background='rgba(239,68,68,.12)';msg.style.color='#fca5a5';return;}const account={name,email,password,school:'',course:'',bio:''};localStorage.setItem('comfortAuthUser',JSON.stringify(account));localStorage.setItem('comfortProfile',JSON.stringify({name,email,school:'',course:'',bio:''}));localStorage.setItem('comfortSession','1');window.location.href='index_2.html';});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js',{scope:'./'}).catch(()=>{}));</script></body></html>
