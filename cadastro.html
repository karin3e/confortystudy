<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComfortStudy - Cadastro</title>

    
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        
        <div class="logo">

            <div class="logo-icon">
                <i class="fa-solid fa-graduation-cap"></i>
            </div>

            <h1>
                Comfort<span>Study</span>
            </h1>

            <p>
                Organize seus estudos,<br>
                conquiste seus objetivos.
            </p>

        </div>


        
        <section class="login-box">

            <h2>Crie sua conta!</h2>

            <p class="description">
                Preencha seus dados para começar.
            </p>


            
            <div class="input-box">

                <i class="fa-regular fa-user"></i>

                <input
                    type="text"
                    id="nome"
                    placeholder="Nome completo"
                >

            </div>


        
            <div class="input-box">

                <i class="fa-regular fa-envelope"></i>

                <input
                    type="email"
                    id="emailCadastro"
                    placeholder="E-mail"
                >

            </div>


            
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="senhaCadastro"
                    placeholder="Senha"
                >

                <button
                    type="button"
                    class="eye"
                    onclick="mostrarSenhaCadastro()"
                >
                    <i
                        id="eyeCadastro"
                        class="fa-regular fa-eye">
                    </i>
                </button>

            </div>


        
            <div class="input-box">

                <i class="fa-solid fa-lock"></i>

                <input
                    type="password"
                    id="confirmarSenha"
                    placeholder="Confirmar senha"
                >

                <button
                    type="button"
                    class="eye"
                    onclick="mostrarConfirmacao()"
                >
                    <i
                        id="eyeConfirmacao"
                        class="fa-regular fa-eye">
                    </i>
                </button>

            </div>


            
            <div class="terms">

                <input
                    type="checkbox"
                    id="termos"
                >

                <label for="termos">
                    Aceito os termos de uso e a política de privacidade.
                </label>

            </div>


            
            <button
                class="btn-login"
                onclick="cadastrar()"
            >

                Criar conta

                <i class="fa-solid fa-arrow-right"></i>

            </button>


        
            <p class="register">

                Já possui uma conta?

                <a href="index.html">
                    Entrar
                </a>

            </p>

        </section>

    </main>



    <script src="script.js"></script>

</body>

</html>
